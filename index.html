<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TON Gift & NFT Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0c0d10;
      --panel: #14161b;
      --panel-2: #191c22;
      --border: #252932;
      --border-soft: #1e222b;
      --text: #f3f4f6;
      --muted: #8b92a0;
      --green: #16a34a;
      --green-bright: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --accent: #3b82f6;
      --accent-bg: rgba(59, 130, 246, 0.14);
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px 14px 36px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(34, 197, 94, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--green-bright);
      flex-shrink: 0;
    }

    .user-meta {
      min-width: 0;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pill-ton {
      background: var(--green-bg);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: var(--green-bright);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 18px 0 6px;
    }

    .section-desc {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }

    .badge-muted {
      font-size: 11px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border-soft);
      padding: 3px 8px;
      border-radius: 999px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .field {
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--green-bright);
    }

    input::placeholder {
      color: #5b6270;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.06s ease, opacity 0.15s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-green {
      background: var(--green);
      color: #fff;
    }

    .btn-green:hover:not(:disabled) {
      background: #15803d;
    }

    .btn-ghost {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: #363c4a;
    }

    .status-box {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }

    .status-ok { color: var(--green-bright); }
    .status-err { color: var(--danger); }

    .nft-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-top: 1px solid var(--border-soft);
    }

    .nft-row:first-child {
      border-top: none;
      padding-top: 2px;
    }

    .nft-left {
      min-width: 0;
    }

    .nft-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nft-addr {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nft-price {
      font-size: 12px;
      font-weight: 700;
      color: #e2e8f0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 5px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .roll-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .roll-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .roll-result {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 18px 10px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="avatar" id="avatarText">TG</div>
        <div class="user-meta">
          <div class="user-name" id="userName">Загрузка игрока...</div>
          <div class="user-sub" id="userSub">ID: —</div>
        </div>
      </div>
      <div class="pill-ton" id="balancePill">0.00 TON</div>
    </div>

    <div class="section-title">NFT и подарки в пуле</div>
    <p class="section-desc">Добавляй предметы прямо из приложения и тестируй дроп из пула.</p>

    <div class="card">
      <div class="card-head">
        <h3 class="card-title">Добавить NFT / подарок</h3>
        <span class="badge-muted">Supabase · nft_items</span>
      </div>

      <div class="field">
        <label for="nftTitle">Название подарка / NFT</label>
        <input id="nftTitle" placeholder="Например: Durov's Cap #42" />
      </div>

      <div class="field">
        <label for="nftAddress">Адрес или уникальный ID</label>
        <input id="nftAddress" placeholder="Например: EQGift0001 или gift_cap_42" />
      </div>

      <div class="field">
        <label for="nftPrice">Ценность (TON)</label>
        <input id="nftPrice" type="number" step="0.01" min="0" placeholder="Например: 2.5" />
      </div>

      <button class="btn btn-green" id="addNftBtn">Добавить в пул</button>
      <div class="status-box" id="statusMsg"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3 class="card-title">Тестовая крутка кейса</h3>
        <span class="badge-muted">Ставка 0.5 TON</span>
      </div>

      <div class="roll-box">
        <div>
          <div class="roll-label">Последний дроп</div>
          <div class="roll-result" id="rollResult">Пока пусто</div>
        </div>
        <div class="badge-muted" id="rollChance">Шанс дропа: 35%</div>
      </div>

      <button class="btn btn-green" id="spinBtn">Крутить за 0.5 TON</button>
      <button class="btn btn-ghost" id="testBonusBtn">Начислить тест-баланс +5 TON</button>
    </div>

    <div class="card">
      <div class="card-head">
        <h3 class="card-title">Доступно в пуле</h3>
        <span class="badge-muted" id="poolCount">0 шт.</span>
      </div>
      <div id="poolList">
        <div class="empty-state">Загрузка списка...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ztjmebmpxmxtofnlboyo.supabase.co";
    const SUPABASE_ANON_KEY = "Sb_publishable_tuZ8DhQusariwnue3dIwGg_MsfnMHCj";
    const NANO = 1_000_000_000;
    const BET_NANO = 500_000_000; // 0.5 TON

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = tg?.initDataUnsafe?.user;
    const telegramId = tgUser?.id || 123456789;
    const displayName = tgUser
      ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ")
      : "Тестовый игрок";

    document.getElementById("userName").textContent = displayName;
    document.getElementById("userSub").textContent = `Telegram ID: ${telegramId}`;
    document.getElementById("avatarText").textContent =
      displayName.slice(0, 2).toUpperCase();

    function setStatus(text, type = "") {
      const el = document.getElementById("statusMsg");
      el.textContent = text;
      el.className = "status-box" + (type ? ` status-${type}` : "");
    }

    function formatTon(nanoton) {
      return `${(Number(nanoton || 0) / NANO).toFixed(2)} TON`;
    }

    async function loadUser() {
      await sb.from("users").upsert(
        { telegram_id: telegramId, balance_nanoton: 0 },
        { onConflict: "telegram_id", ignoreDuplicates: true }
      );

      const { data, error } = await sb
        .from("users")
        .select("id, balance_nanoton")
        .eq("telegram_id", telegramId)
        .single();

      if (error) {
        setStatus(`Ошибка баланса: ${error.message}`, "err");
        return null;
      }

      document.getElementById("balancePill").textContent = formatTon(data.balance_nanoton);
      return data;
    }

    async function loadPool() {
      const { data, error } = await sb
        .from("nft_items")
        .select("id, title, nft_address, value_nanoton, status")
        .eq("status", "in_pool")
        .order("created_at", { ascending: false });

      const listEl = document.getElementById("poolList");
      const countEl = document.getElementById("poolCount");

      if (error) {
        listEl.innerHTML = `<div class="empty-state">Ошибка: ${error.message}</div>`;
        return [];
      }

      countEl.textContent = `${data.length} шт.`;
      if (!data.length) {
        listEl.innerHTML = `<div class="empty-state">Пул пуст — добавь первый NFT выше.</div>`;
        return [];
      }

      listEl.innerHTML = data
        .map(
          (item) => `
          <div class="nft-row">
            <div class="nft-left">
              <div class="nft-name">${escapeHtml(item.title)}</div>
              <div class="nft-addr">${escapeHtml(item.nft_address)}</div>
            </div>
            <div class="nft-price">${formatTon(item.value_nanoton)}</div>
          </div>`
        )
        .join("");

      return data;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    document.getElementById("addNftBtn").addEventListener("click", async () => {
      const btn = document.getElementById("addNftBtn");
      const title = document.getElementById("nftTitle").value.trim();
      const nftAddress = document.getElementById("nftAddress").value.trim();
      const priceTon = parseFloat(document.getElementById("nftPrice").value);

      if (!title || !nftAddress || Number.isNaN(priceTon) || priceTon < 0) {
        setStatus("Заполни название, адрес/ID и цену в TON.", "err");
        return;
      }

      btn.disabled = true;
      setStatus("Сохраняем предмет в пул...");

      const { error } = await sb.from("nft_items").insert({
        title,
        nft_address: nftAddress,
        value_nanoton: Math.round(priceTon * NANO),
        status: "in_pool",
      });

      btn.disabled = false;

      if (error) {
        setStatus(`Ошибка: ${error.message}`, "err");
        return;
      }

      document.getElementById("nftTitle").value = "";
      document.getElementById("nftAddress").value = "";
      document.getElementById("nftPrice").value = "";
      setStatus("Предмет добавлен в пул!", "ok");
      await loadPool();
    });

    document.getElementById("testBonusBtn").addEventListener("click", async () => {
      const user = await loadUser();
      if (!user) return;

      const nextBalance = Number(user.balance_nanoton || 0) + 5 * NANO;
      const { error } = await sb
        .from("users")
        .update({ balance_nanoton: nextBalance })
        .eq("telegram_id", telegramId);

      if (error) {
        setStatus(`Не удалось начислить баланс: ${error.message}`, "err");
        return;
      }

      setStatus("Начислено +5.00 TON для теста.", "ok");
      await loadUser();
    });

    document.getElementById("spinBtn").addEventListener("click", async () => {
      const spinBtn = document.getElementById("spinBtn");
      spinBtn.disabled = true;
      setStatus("Крутим...");

      try {
        const user = await loadUser();
        if (!user) return;

        if (Number(user.balance_nanoton) < BET_NANO) {
          setStatus("Не хватает баланса! Нажми «Начислить тест-баланс +5 TON».", "err");
          return;
        }

        const pool = await loadPool();
        const roll = Math.floor(Math.random() * 100); // 0..99
        let wonItem = null;
        let payoutNano = 0;

        if (roll < 35 && pool.length > 0) {
          wonItem = pool[Math.floor(Math.random() * pool.length)];
        } else if (roll >= 35 && roll < 50) {
          payoutNano = 750_000_000; // 0.75 TON возврат/выигрыш
        }

        const newBalance = Number(user.balance_nanoton) - BET_NANO + payoutNano;

        const { error: balErr } = await sb
          .from("users")
          .update({ balance_nanoton: newBalance })
          .eq("telegram_id", telegramId);

        if (balErr) throw balErr;

        if (wonItem) {
          const { error: nftErr } = await sb
            .from("nft_items")
            .update({ owner_user_id: user.id, status: "in_user_inventory" })
            .eq("id", wonItem.id)
            .eq("status", "in_pool");

          if (nftErr) throw nftErr;

          document.getElementById("rollResult").textContent = `NFT: ${wonItem.title}`;
          setStatus(`Выпал подарок «${wonItem.title}» — перенесён в инвентарь!`, "ok");
        } else if (payoutNano > 0) {
          document.getElementById("rollResult").textContent = `+0.75 TON`;
          setStatus("Выпал бонус +0.75 TON!", "ok");
        } else {
          document.getElementById("rollResult").textContent = `Мимо (${roll})`;
          setStatus("В этот раз мимо — попробуй ещё раз.", "");
        }

        await loadUser();
        await loadPool();
      } catch (e) {
        setStatus(`Ошибка крутки: ${e.message || e}`, "err");
      } finally {
        spinBtn.disabled = false;
      }
    });

    (async () => {
      await loadUser();
      await loadPool();
    })();
  </script>
</body>
</html>
